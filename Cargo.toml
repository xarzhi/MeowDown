[package]
name = "meowdown"
version = "0.1.0"
edition = "2024"
description = "A Typora-like WYSIWYG Markdown editor built with GPUI Kit"

[dependencies]
gpui-kit = { version = "0.9.0", features = ["syntect"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# A paragraph mixes faces on one line 鈥?prose in the UI font, a code span in the
# code font 鈥?and an editor paints a whole line in the family its element was
# given. The field can only be taught otherwise by splitting its runs, which is
# what this copy adds (`set_font_family_runs`). Without it a chip changes face
# and width the moment the caret lands in the paragraph.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
